[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lc-framework"
version = "0.1.0"
description = "Unified probability-based land cover mapping framework across pixel, geo-object (GEOBIA), and hybrid paradigms in GEE and Python/Colab."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "rasterio>=1.3",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
gee = [
    "earthengine-api>=0.1.400",
    "geemap>=0.30",
]
luma = [
    "earthengine-api>=0.1.400",
]
ml = [
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "geopandas>=0.14",
]
obia = [
    "scikit-image>=0.22",
    "scikit-learn>=1.3",
    "geopandas>=0.14",
]
viz = [
    "matplotlib>=3.7",
    "plotly>=5.18",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_gee: tests that require an authenticated Google Earth Engine session",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = true
check_untyped_defs = true
